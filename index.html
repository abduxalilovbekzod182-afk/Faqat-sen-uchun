<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050308">
  <meta name="description" content="Turli tillarda yozilgan sevgi so‘zlaridan yasalgan aylanib turuvchi yurak.">
  <title>Faqat sen uchun ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sahifa">
    <p class="ust-sarlavha">DUNYODAGI BARCHA TILLARDA…</p>
    <h1>Faqat sen uchun</h1>
    <div class="yurak-konteyner" role="img" aria-label="Turli tillarda seni sevaman deb yozilgan, sekin aylanayotgan yurak">
      <canvas id="sevgi-yuragi"></canvas>
      <div class="yurak-yorugligi" aria-hidden="true"></div>
    </div>
    <p class="pastki-matn">Bir yurak. Ming xil til. Bitta tuyg‘u. <span>♥</span></p>
    <a class="qoshiq-havolasi" href="https://www.youtube.com/watch?v=fJLQCf4mFP0" target="_blank" rel="noopener noreferrer">♫ I Wanna Be Yours — qo‘shiqni tinglash</a>
  </main>

  <script>
    const canvas = document.getElementById('sevgi-yuragi');
    const ctx = canvas.getContext('2d');
    const phrases = [
      'SENI SEVAMAN', 'I LOVE YOU', 'Я ТЕБЯ ЛЮБЛЮ', 'TE QUIERO',
      'JE T’AIME', 'ICH LIEBE DICH', 'SENI SEVIYORUM', '愛してる',
      '사랑해', 'أحبك', 'TI AMO', 'EU TE AMO', 'Я ЛЮБЛЮ ТЕБЯ',
      'NAKU PENDA', 'Kocham cię', 'AŠ TAVE MYLIU', 'Szeretlek'
    ];
    const rows = [];
    for (let y = -1.12; y <= 1.12; y += 0.085) {
      for (let x = -1.23; x <= 1.23; x += 0.12) {
        const inside = Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0;
        if (inside) rows.push({ x, y, phrase: phrases[Math.floor(Math.random() * phrases.length)] });
      }
    }

    let width, height, dpr;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const box = canvas.getBoundingClientRect();
      width = box.width;
      height = box.height;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    let angle = 0;
    function draw() {
      ctx.clearRect(0, 0, width, height);
      const scale = Math.min(width * 0.39, height * 0.39);
      const cx = width / 2;
      const cy = height / 2;
      angle += 0.006;
      const turn = Math.sin(angle);
      const face = Math.cos(angle);

      rows.forEach((point, index) => {
        const depth = Math.sqrt(Math.max(0, 1 - Math.min(1, point.x * point.x + point.y * point.y) * 0.45));
        const rotatedX = point.x * face + depth * turn * 0.34;
        const z = -point.x * turn + depth * face * 0.34;
        const perspective = 1 / (1.3 + z * 0.16);
        const px = cx + rotatedX * scale * perspective;
        const py = cy - point.y * scale * perspective;
        const alpha = Math.max(0.35, Math.min(1, 0.72 + z * 0.2));
        const frontColor = z > -0.05 ? `rgba(255, ${168 + Math.floor(alpha * 40)}, ${205 + Math.floor(alpha * 25)}, ${alpha})` : `rgba(174, 92, 139, ${alpha * 0.78})`;
        ctx.font = `${Math.max(7, scale * 0.052)}px Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = z > 0 ? 'rgba(255, 115, 176, .8)' : 'transparent';
        ctx.shadowBlur = z > 0 ? 8 : 0;
        ctx.fillStyle = frontColor;
        ctx.fillText(point.phrase, px, py);
      });
      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
