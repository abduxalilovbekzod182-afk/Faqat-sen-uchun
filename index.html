<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050308">
  <meta name="description" content="Turli tillarda yozilgan sevgi so‘zlari bilan yurak animatsiyasi.">
  <title>Faqat sen uchun ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- YouTube musiqasi ko‘rinmaydigan fonda ulanadi. Ovozli autoplay brauzer tomonidan bloklanishi mumkin. -->
  <div class="audio-bg" aria-hidden="true">
    <iframe
      id="music-player"
      title="Fon musiqasi"
      src="https://www.youtube-nocookie.com/embed/fukGbiPuBjU?autoplay=1&mute=0&controls=0&loop=1&playlist=fukGbiPuBjU&playsinline=1&enablejsapi=1"
      allow="autoplay; encrypted-media"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <main class="sahifa">
    <p class="ust-sarlavha">DUNYODAGI BARCHA TILLARDA…</p>
    <h1>Faqat sen uchun</h1>

    <div class="yurak-konteyner" role="img" aria-label="Turli tillarda seni sevaman deb yozilgan yurak">
      <canvas id="sevgi-yuragi"></canvas>
      <div class="yurak-yorugligi" aria-hidden="true"></div>
    </div>

    <p class="pastki-matn">Bir yurak. Ming xil til. Bitta tuyg‘u. <span>♥</span></p>
    <p class="musiqa-eslatma" id="musiqa-eslatma" aria-live="polite"></p>
  </main>

  <script>
    const canvas = document.getElementById('sevgi-yuragi');
    const ctx = canvas.getContext('2d');
    const phrases = [
      'SENI SEVAMAN', 'I LOVE YOU', 'Я ТЕБЯ ЛЮБЛЮ', 'TE QUIERO',
      'JE T’AIME', 'ICH LIEBE DICH', 'SENI SEVIYORUM', '愛してる',
      '사랑해', 'أحبك', 'TI AMO', 'EU TE AMO', 'KOCHAM CIĘ',
      'AŠ TAVE MYLIU', 'SZERETLEK', 'MİNI SEVİRƏM'
    ];

    // Yurak tenglamasi bo‘yicha matnlarni joylashtirib, shaklning chetlaridan chiqarmaymiz.
    const words = [];
    for (let y = -1.12; y <= 1.121; y += 0.075) {
      for (let x = -1.24; x <= 1.241; x += 0.105) {
        if (Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0) {
          words.push({ x, y, text: phrases[Math.floor(Math.random() * phrases.length)] });
        }
      }
    }

    let width = 0;
    let height = 0;
    let dpr = 1;
    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawHeart();
    }

    function drawHeart() {
      if (!width || !height) return;
      ctx.clearRect(0, 0, width, height);
      const scaleX = Math.min(width * 0.43, height * 0.39);
      const scaleY = Math.min(height * 0.43, width * 0.48);
      const cx = width / 2;
      const cy = height / 2 + scaleY * 0.02;

      // Yurak konturi yumshoq nur bilan aniq ko‘rinadi.
      ctx.beginPath();
      for (let i = 0; i <= 240; i++) {
        const t = (i / 240) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3) / 17;
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17;
        const px = cx + x * scaleX;
        const py = cy + y * scaleY;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(126, 28, 76, 0.12)';
      ctx.shadowColor = 'rgba(255, 91, 157, 0.7)';
      ctx.shadowBlur = 28;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255, 165, 203, 0.58)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fontSize = Math.max(7, Math.min(10, width * 0.026));
      ctx.font = `600 ${fontSize}px Arial, sans-serif`;
      words.forEach((word, i) => {
        const px = cx + word.x * scaleX;
        const py = cy - word.y * scaleY;
        const shimmer = 0.76 + Math.sin(Date.now() / 900 + i * 0.35) * 0.18;
        ctx.fillStyle = `rgba(255, ${190 + (i % 3) * 12}, ${218 + (i % 2) * 16}, ${shimmer})`;
        ctx.shadowColor = 'rgba(255, 126, 185, 0.55)';
        ctx.shadowBlur = 5;
        ctx.fillText(word.text, px, py, fontSize * 8.8);
      });
      ctx.shadowBlur = 0;
      requestAnimationFrame(drawHeart);
    }

    window.addEventListener('resize', resize);
    resize();

    // Ovozli autoplay ko‘p brauzerda bloklanadi; sahifaning ilk teginishida musiqani qayta boshlashga urinadi.
    const musicFrame = document.getElementById('music-player');
    let musicStarted = false;
    function startMusic() {
      if (musicStarted) return;
      musicStarted = true;
      musicFrame.contentWindow?.postMessage(JSON.stringify({ event: 'command', func: 'unMute', args: [] }), '*');
      musicFrame.contentWindow?.postMessage(JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*');
    }
    window.addEventListener('pointerdown', startMusic, { once: true });
    window.addEventListener('keydown', startMusic, { once: true });
    setTimeout(() => {
      if (!musicStarted) {
        document.getElementById('musiqa-eslatma').textContent = 'Agar musiqa boshlanmasa, sahifaga bir marta teging — brauzer autoplayni cheklashi mumkin.';
      }
    }, 3500);
  </script>
</body>
</html>
